name: Check extension and publish live preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:preview
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Verify native VS Code merge integration
        run: |
          curl --fail --location --retry 3 https://update.code.visualstudio.com/latest/linux-x64/stable --output "$RUNNER_TEMP/vscode.tar.gz"
          mkdir "$RUNNER_TEMP/merge-test-vscode"
          tar -xzf "$RUNNER_TEMP/vscode.tar.gz" -C "$RUNNER_TEMP/merge-test-vscode" --strip-components=1
          export VSCODE_EXECUTABLE="$RUNNER_TEMP/merge-test-vscode/code"
          xvfb-run -a npm run test:merge-integration
          xvfb-run -a npm run test:host
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: merge-and-blame-vsix
          path: '*.vsix'
          if-no-files-found: error
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy live preview
        id: deployment
        uses: actions/deploy-pages@v4
