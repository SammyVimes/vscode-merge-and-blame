name: Publish to Visual Studio Marketplace

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test the VSIX without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: marketplace-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Check release identity and version
        id: release
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          assert.equal(manifest.publisher, 'SemyonDanilov');
          assert.equal(manifest.name, 'merge-and-blame');
          assert.match(manifest.version, /^\d+\.\d+\.\d+$/);
          assert.equal(lock.version, manifest.version, 'package-lock.json must match the release version');
          assert.equal(lock.packages[''].version, manifest.version);
          if (process.env.GITHUB_REF_TYPE === 'tag') {
            assert.equal(process.env.GITHUB_REF_NAME, `v${manifest.version}`, 'Release tag must match package.json');
          } else {
            assert.equal(process.env.GITHUB_REF, 'refs/heads/main', 'Run manual publishing from main');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${manifest.version}\n`);
          JS
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:preview
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Verify native VS Code merge integration
        run: |
          curl --fail --location --retry 3 https://update.code.visualstudio.com/latest/linux-x64/stable --output "$RUNNER_TEMP/vscode.tar.gz"
          mkdir "$RUNNER_TEMP/merge-test-vscode"
          tar -xzf "$RUNNER_TEMP/vscode.tar.gz" -C "$RUNNER_TEMP/merge-test-vscode" --strip-components=1
          export VSCODE_EXECUTABLE="$RUNNER_TEMP/merge-test-vscode/code"
          xvfb-run -a npm run test:merge-integration
          xvfb-run -a npm run test:host
      - name: Package the tested extension
        run: npm run package -- --out release.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-vsix
          path: release.vsix
          if-no-files-found: error
          overwrite: true

  publish:
    if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: marketplace-vsix
      - name: Publish the tested VSIX using Trusted Publishing
        run: npx --no-install vsce publish --oidc --packagePath release.vsix
      - name: Check public Marketplace availability
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const id = 'SemyonDanilov.merge-and-blame';
          const url = `https://marketplace.visualstudio.com/items?itemName=${id}`;
          let available = false;
          try {
            const response = await fetch('https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery', {
              method: 'POST',
              headers: { Accept: 'application/json;api-version=3.0-preview.1', 'Content-Type': 'application/json' },
              // IncludeVersions (1) + ExcludeNonValidated (32). Downloadable
              // assets alone do not prove that Marketplace validation passed.
              body: JSON.stringify({ filters: [{ criteria: [{ filterType: 7, value: id }], pageNumber: 1, pageSize: 1 }], flags: 33 }),
              signal: AbortSignal.timeout(20000),
            });
            if (!response.ok) throw new Error(`Catalog returned HTTP ${response.status}`);
            const result = await response.json();
            const version = result.results?.[0]?.extensions?.[0]?.versions?.find(version => version.version === process.env.RELEASE_VERSION);
            if (version) available = (await fetch(url, { signal: AbortSignal.timeout(20000) })).ok;
          } catch (error) {
            console.log(`::warning::Public availability check: ${error.message}`);
          }
          const status = available ? 'Available on Marketplace' : 'Upload accepted; public validation/listing is not yet confirmed';
          if (!available) console.log('::warning::The upload succeeded, but the public Marketplace listing is not confirmed. Check validation status in the publisher dashboard.');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `**${status}** — [Merge & Blame ${process.env.RELEASE_VERSION}](${url}).\n`);
          JS
